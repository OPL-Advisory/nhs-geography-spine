name: CI

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests web spikes
      - run: node --test web/tests/*.test.mjs
      - run: npm ci --prefix web --ignore-scripts
      - run: cd web && npx playwright install --with-deps chromium firefox webkit
      - run: LENS_BROWSER_CHECKS=1 LENS_PIN_REPORT="$RUNNER_TEMP/pin-during-load.json" python -m pytest -q tests/test_preview_release.py -k initial_page
      - run: python -m web.rehearse --directory "$RUNNER_TEMP/lens-preview"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-preview-evidence
          path: |
            ${{ runner.temp }}/lens-preview/browser
            ${{ runner.temp }}/lens-preview/hosting-results.json
            ${{ runner.temp }}/pin-during-load.json
