[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhs_geo_spine"]

[project]
name = "nhs-geography-spine"
version = "0.3.0"
description = "Versioned NHS organisation and population geography mappings to UK parliamentary constituencies"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
nhs-geo = "nhs_geo_spine.build:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["B008"]  # Typer intentionally declares CLI options in defaults.
